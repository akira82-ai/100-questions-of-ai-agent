<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
  <title id="title">AI 磊叔 SVG 模板 - 解构版</title>
  <desc id="desc">用于拆解流程、方法论、步骤型内容的长图模板。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5efe5"/>
      <stop offset="55%" stop-color="#f3f1ea"/>
      <stop offset="100%" stop-color="#e8f2ef"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef6c1f"/>
      <stop offset="100%" stop-color="#f6b44c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#111827" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="1800" fill="url(#bg)"/>
  <circle cx="1020" cy="210" r="170" fill="#fde7d7" opacity="0.9"/>
  <circle cx="165" cy="1500" r="220" fill="#daf0ea" opacity="0.95"/>

  <text x="90" y="126" fill="#8a3412" font-size="28" font-weight="700" font-family="Avenir Next, PingFang SC, Helvetica Neue, Arial, sans-serif">AI 磊叔 · [栏目名]</text>
  <text x="90" y="230" fill="#111827" font-size="70" font-weight="800" font-family="Avenir Next, PingFang SC, Helvetica Neue, Arial, sans-serif">[主标题第一行]</text>
  <text x="90" y="314" fill="#111827" font-size="70" font-weight="800" font-family="Avenir Next, PingFang SC, Helvetica Neue, Arial, sans-serif">[主标题第二行]</text>
  <text x="90" y="390" fill="#374151" font-size="34" font-weight="500" font-family="Avenir Next, PingFang SC, Helvetica Neue, Arial, sans-serif">[副标题 / 一句话结论 / 这张图想让人先拿走什么]</text>

  <g filter="url(#shadow)">
    <rect x="80" y="470" width="1040" height="980" rx="34" fill="#fffdf8"/>
  </g>

  <g transform="translate(110 520)">
    <rect x="0" y="0" width="980" height="180" rx="28" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <circle cx="58" cy="55" r="28" fill="url(#accent)"/>
    <text x="58" y="64" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="800" font-family="Avenir Next, PingFang SC, Helvetica Neue, Arial, sans-serif">1</text>
    <text x="110" y="60" fill="#9a3412" font-size="24" font-weight="800" font-family="Avenir Next, PingFang SC, Helvetica Neue, Arial, sans-serif">[模块标签]</text>
    <text x="110" y="108" fill="#111827" font-size="40" font-weight="800" font-family="Avenir Next, PingFang SC, Helvetica Neue, Arial, sans-serif">[模块 1 标题]</text>
    <text x="110" y="150" fill="#374151" font-size="28" font-weight="500" font-family="Avenir Next, PingFang SC, Helvetica Neue, Arial, sans-serif">[模块 1 说明，建议 1 到 2 行，解释判断或动作。]</text>

    <rect x="0" y="215" width="980" height="180" rx="28" fill="#eef6ff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="58" cy="270" r="28" fill="#2563eb"/>
    <text x="58" y="279" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="800" font-family="Avenir Next, PingFang SC, Helvetica Neue, Arial, sans-serif">2</text>
    <text x="110" y="275" fill="#1d4ed8" font-size="24" font-weight="800" font-family="Avenir Next, PingFang SC, Helvetica Neue, Arial, sans-serif">[模块标签]</text>
    <text x="110" y="323" fill="#111827" font-size="40" font-weight="800" font-family="Avenir Next, PingFang SC, Helvetica Neue, Arial, sans-serif">[模块 2 标题]</text>
    <text x="110" y="365" fill="#374151" font-size="28" font-weight="500" font-family="Avenir Next, PingFang SC, Helvetica Neue, Arial, sans-serif">[模块 2 说明，建议讲清楚为什么会出问题。]</text>

    <rect x="0" y="430" width="980" height="180" rx="28" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
    <circle cx="58" cy="485" r="28" fill="#0f766e"/>
    <text x="58" y="494" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="800" font-family="Avenir Next, PingFang SC, Helvetica Neue, Arial, sans-serif">3</text>
    <text x="110" y="490" fill="#0f766e" font-size="24" font-weight="800" font-family="Avenir Next, PingFang SC, Helvetica Neue, Arial, sans-serif">[模块标签]</text>
    <text x="110" y="538" fill="#111827" font-size="40" font-weight="800" font-family="Avenir Next, PingFang SC, Helvetica Neue, Arial, sans-serif">[模块 3 标题]</text>
    <text x="110" y="580" fill="#374151" font-size="28" font-weight="500" font-family="Avenir Next, PingFang SC, Helvetica Neue, Arial, sans-serif">[模块 3 说明，建议落到具体动作、步骤或观察。]</text>

    <rect x="0" y="645" width="980" height="180" rx="28" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <circle cx="58" cy="700" r="28" fill="#16a34a"/>
    <text x="58" y="709" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="800" font-family="Avenir Next, PingFang SC, Helvetica Neue, Arial, sans-serif">4</text>
    <text x="110" y="705" fill="#15803d" font-size="24" font-weight="800" font-family="Avenir Next, PingFang SC, Helvetica Neue, Arial, sans-serif">[模块标签]</text>
    <text x="110" y="753" fill="#111827" font-size="40" font-weight="800" font-family="Avenir Next, PingFang SC, Helvetica Neue, Arial, sans-serif">[模块 4 标题]</text>
    <text x="110" y="795" fill="#374151" font-size="28" font-weight="500" font-family="Avenir Next, PingFang SC, Helvetica Neue, Arial, sans-serif">[模块 4 说明，建议写结论、复盘或最后的判断标准。]</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="1510" width="1040" height="210" rx="34" fill="#111827"/>
  </g>
  <text x="120" y="1580" fill="#f9fafb" font-size="32" font-weight="800" font-family="Avenir Next, PingFang SC, Helvetica Neue, Arial, sans-serif">[底部 takeaway 标题]</text>
  <text x="120" y="1632" fill="#fde68a" font-size="27" font-weight="700" font-family="Avenir Next, PingFang SC, Helvetica Neue, Arial, sans-serif">1. [一句拿走就能用的话]</text>
  <text x="120" y="1676" fill="#bfdbfe" font-size="27" font-weight="700" font-family="Avenir Next, PingFang SC, Helvetica Neue, Arial, sans-serif">2. [一句判断标准 / checklist]</text>
</svg>
